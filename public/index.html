<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vinyl-now-playing</title>
  <meta name="description" content="A spinning ASCII vinyl showing what I'm listening to on Last.fm." />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d1117;
      color: #8b949e;
      font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    main { padding: 32px 16px; text-align: center; }
    img { max-width: 100%; height: auto; }
    a { color: #c9d1d9; }
    p { margin: 12px 0 0; }
  </style>
</head>
<body>
  <main>
    <a href="https://www.last.fm/user/barrosw5">
      <img src="/api/vinyl" alt="What I'm listening to right now" width="504" height="488" />
    </a>
    <p>
      <a href="https://github.com/barrosw5/vinyl-barrosw5">source on GitHub</a>
      · audio previews and tempo data from <a href="https://www.deezer.com">Deezer</a>
    </p>
  </main>
</body>
</html>
